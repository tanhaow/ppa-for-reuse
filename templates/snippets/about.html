{% load static %}

<div class="about ui simple item dropdown{% if active == 'about' %} triangle{% endif %}{% if mobile %} dropdown{% endif %}"
     data-nav-target="aboutMenu"
     data-action="focusin->nav#aboutFocusIn focusout->nav#aboutFocusOut keydown->nav#aboutKeydown{% if mobile %} click->nav#toggleMobileDropdown{% endif %}">
    <div class="text" data-nav-target="aboutText" tabindex="0">About</div>
    <img class="dropdown icon" src="{% static 'img/icons/RightChevron.svg' %}" alt="">
    <div class="menu submenu">
        {# NOTE: currently relies on editorial not having show_in_menu set #}
        {% for page in request.site.root_page.get_children.live.in_menu %}
        <div class="item"><a href="{{ page.url }}">{{ page.title }}</a></div>
        {% endfor %}
    </div>
</div>
